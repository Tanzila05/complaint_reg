<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Complaint Registration System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Complaint Registration System</h1>
            <nav>
                <a href="index.html">Submit Complaint</a>
                <a href="track.html">Track Complaints</a>
            </nav>
        </header>

        <main>
            <section class="login-section">
                <div class="login-container">
                    <h2>Login</h2>
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="username">Username *</label>
                            <input type="text" id="username" name="username" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password *</label>
                            <input type="password" id="password" name="password" required>
                        </div>

                        <button type="submit" class="btn-primary">Login</button>
                    </form>

                    <div class="login-help">
                        <p>Default admin credentials:</p>
                        <p><strong>Username:</strong> admin</p>
                        <p><strong>Password:</strong> admin123</p>
                    </div>

                    <div class="register-link">
                        <p>Don't have an account? <a href="#" onclick="showRegisterForm()">Register</a></p>
                    </div>
                </div>

                <div id="registerContainer" class="login-container hidden">
                    <h2>Register</h2>
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="reg-username">Username *</label>
                            <input type="text" id="reg-username" name="username" required>
                        </div>

                        <div class="form-group">
                            <label for="reg-email">Email *</label>
                            <input type="email" id="reg-email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="reg-password">Password *</label>
                            <input type="password" id="reg-password" name="password" required minlength="6">
                            <small>Password must be at least 6 characters</small>
                        </div>

                        <div class="form-group">
                            <label for="reg-confirm-password">Confirm Password *</label>
                            <input type="password" id="reg-confirm-password" name="confirm_password" required>
                        </div>

                        <button type="submit" class="btn-primary">Register</button>
                    </form>

                    <div class="register-link">
                        <p>Already have an account? <a href="#" onclick="showLoginForm()">Login</a></p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="auth.js"></script>
</body>
</html>
